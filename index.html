<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifeasy INTERIOR — Login</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', -apple-system, system-ui, sans-serif; }
body {
  background: linear-gradient(135deg, #FEF2F2 0%, #F8FAFC 50%, #EFF6FF 100%);
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #0F172A;
}

:root {
  --red: #E63946;
  --red-dark: #C8102E;
  --grey: #6B7280;
  --border: #E2E8F0;
  --success: #10B981;
  --danger: #EF4444;
}

.login-card {
  background: #FFFFFF;
  border-radius: 20px;
  box-shadow: 0 20px 60px rgba(0,0,0,0.08);
  max-width: 440px;
  width: 100%;
  padding: 0;
  overflow: hidden;
  position: relative;
}

.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 6px;
  background: linear-gradient(90deg, var(--red) 0%, var(--red-dark) 100%);
}

.login-inner {
  padding: 48px 42px 36px;
}

.brand {
  text-align: center;
  margin-bottom: 36px;
}

.brand-logo {
  max-height: 56px;
  width: auto;
  margin-bottom: 8px;
}

.brand-fallback {
  font-size: 32px;
  font-weight: 800;
  color: var(--red);
  letter-spacing: -1px;
  line-height: 1;
}

.brand-fallback small {
  display: block;
  font-size: 11px;
  color: var(--grey);
  letter-spacing: 7px;
  font-weight: 600;
  margin-top: 4px;
}

.brand-tagline {
  font-size: 13px;
  color: var(--grey);
  margin-top: 12px;
  font-weight: 500;
}

.error-box {
  background: #FEF2F2;
  border-left: 4px solid var(--danger);
  color: #991B1B;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 20px;
  display: none;
  animation: shake 0.4s;
}

.error-box.show { display: block; }

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  75% { transform: translateX(6px); }
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #0F172A;
  margin-bottom: 8px;
}

.form-group input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid var(--border);
  border-radius: 12px;
  font-size: 14px;
  outline: none;
  font-family: inherit;
  transition: all 0.2s;
  background: #FFFFFF;
  color: #0F172A;
}

.form-group input:focus {
  border-color: var(--red);
  box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.08);
}

.form-group input:disabled {
  background: #F8FAFC;
  cursor: not-allowed;
  opacity: 0.7;
}

.password-wrap {
  position: relative;
}

.password-toggle {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  cursor: pointer;
  font-size: 16px;
  color: var(--grey);
  user-select: none;
  padding: 4px;
  border-radius: 6px;
  transition: background 0.2s;
}

.password-toggle:hover {
  background: #F1F5F9;
}

.login-btn {
  width: 100%;
  padding: 15px;
  background: linear-gradient(135deg, var(--red) 0%, var(--red-dark) 100%);
  color: #FFFFFF;
  border: none;
  border-radius: 12px;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  margin-top: 10px;
  letter-spacing: 0.3px;
  transition: all 0.2s;
  box-shadow: 0 4px 14px rgba(230, 57, 70, 0.3);
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  min-height: 52px;
}

.login-btn:hover:not(:disabled) {
  transform: translateY(-1px);
  box-shadow: 0 8px 20px rgba(230, 57, 70, 0.4);
}

.login-btn:active:not(:disabled) {
  transform: translateY(0);
}

.login-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
  transform: none;
}

.spinner {
  width: 18px;
  height: 18px;
  border: 2.5px solid rgba(255,255,255,0.3);
  border-top-color: #FFFFFF;
  border-radius: 50%;
  animation: spin 0.7s linear infinite;
  display: none;
}

.login-btn.loading .spinner { display: block; }
.login-btn.loading .btn-text { opacity: 0.8; }

@keyframes spin {
  to { transform: rotate(360deg); }
}

.footer {
  text-align: center;
  padding: 22px 42px 28px;
  font-size: 12px;
  color: #94A3B8;
  border-top: 1px solid #F1F5F9;
  background: #FAFBFC;
}

.footer strong {
  color: var(--red);
  font-weight: 700;
}

.help-text {
  text-align: center;
  font-size: 12px;
  color: var(--grey);
  margin-top: 18px;
}

@media (max-width: 480px) {
  .login-inner { padding: 36px 26px 28px; }
  .brand-logo { max-height: 44px; }
  .brand-fallback { font-size: 26px; }
  .brand-fallback small { font-size: 9px; letter-spacing: 5px; }
  .footer { padding: 18px 26px 22px; }
}
</style>
</head>
<body>

<div class="login-card">
  <div class="login-inner">
    <div class="brand">
      <img src="https://lifeasyinterior.com/wp-content/uploads/2024/01/lifeasy-interior-logo.png" alt="Lifeasy INTERIOR" class="brand-logo" onerror="this.style.display='none'; this.nextElementSibling.style.display='block';">
      <div class="brand-fallback" style="display:none;">Lifeasy<small>INTERIOR</small></div>
      <div class="brand-tagline">CRM Login</div>
    </div>

    <div class="error-box" id="errorBox"></div>

    <form id="loginForm" autocomplete="on" onsubmit="event.preventDefault(); handleLogin();">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" name="username" placeholder="Enter your username" autocomplete="username" required>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="password-wrap">
          <input type="password" id="password" name="password" placeholder="Enter your password" autocomplete="current-password" required>
          <span class="password-toggle" onclick="togglePassword()" id="pwToggle">👁️</span>
        </div>
      </div>

      <button type="submit" class="login-btn" id="loginBtn">
        <span class="spinner"></span>
        <span class="btn-text">Login</span>
      </button>
    </form>

    <div class="help-text">Forgot password? Contact your Admin</div>
  </div>

  <div class="footer">© <strong>Lifeasy INTERIOR</strong> — All rights reserved</div>
</div>

<script>
// ============================================================
// CONFIG — ✅ FIXED: correct Worker URL
// ============================================================
const WORKER_URL = 'https://lifeasy-crm-api.lifeasyinteriorcrm.workers.dev';

// ============================================================
// SESSION CHECK — if already logged in, skip to dashboard
// ============================================================
(function checkSession() {
  try {
    const raw = localStorage.getItem('lifeasy_session');
    if (!raw) return;
    const s = JSON.parse(raw);
    if (s && s.loginTime && (Date.now() - s.loginTime) < 8 * 60 * 60 * 1000) {
      window.location.href = 'dashboard.html';
    } else {
      localStorage.removeItem('lifeasy_session');
    }
  } catch(e) { localStorage.removeItem('lifeasy_session'); }
})();

// ============================================================
// PASSWORD TOGGLE
// ============================================================
function togglePassword() {
  const pw = document.getElementById('password');
  const tg = document.getElementById('pwToggle');
  if (pw.type === 'password') {
    pw.type = 'text';
    tg.textContent = '🙈';
  } else {
    pw.type = 'password';
    tg.textContent = '👁️';
  }
}

// ============================================================
// ERROR HANDLER
// ============================================================
function showError(msg) {
  const box = document.getElementById('errorBox');
  box.textContent = msg;
  box.classList.add('show');
  clearTimeout(box._timer);
  box._timer = setTimeout(() => box.classList.remove('show'), 5000);
}

function hideError() {
  document.getElementById('errorBox').classList.remove('show');
}

// ============================================================
// LOGIN
// ============================================================
async function handleLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');

  hideError();

  if (!username || !password) {
    showError('Please enter both username and password');
    return;
  }

  btn.disabled = true;
  btn.classList.add('loading');
  btn.querySelector('.btn-text').textContent = 'Logging in...';

  try {
    // ✅ FIXED: text/plain content type (GAS compatible)
    const res = await fetch(WORKER_URL + '/', {
      method: 'POST',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' },
      body: JSON.stringify({
        action: 'login',
        username: username,
        password: password
      })
    });

    if (!res.ok) {
      throw new Error('Server responded with ' + res.status);
    }

    const data = await res.json();

    if (data.success && data.user) {
      // Save session
      const session = {
        userId: data.user.userId || '',
        name: data.user.name || '',
        role: data.user.role || '',
        phone: data.user.phone || '',
        username: data.user.username || username,
        email: data.user.email || '',
        loginTime: Date.now()
      };
      localStorage.setItem('lifeasy_session', JSON.stringify(session));

      btn.querySelector('.btn-text').textContent = 'Success! Redirecting...';

      setTimeout(() => {
        window.location.href = 'dashboard.html';
      }, 500);
    } else {
      showError(data.error || 'Invalid username or password');
      resetBtn();
    }
  } catch (err) {
    console.error('Login error:', err);
    if (err.message && err.message.includes('Failed to fetch')) {
      showError('Connection error. Please check your internet and try again.');
    } else if (err.message && err.message.includes('Server responded')) {
      showError('Server error. Please try again in a moment.');
    } else {
      showError('Connection error. Please try again.');
    }
    resetBtn();
  }
}

function resetBtn() {
  const btn = document.getElementById('loginBtn');
  btn.disabled = false;
  btn.classList.remove('loading');
  btn.querySelector('.btn-text').textContent = 'Login';
}

// ============================================================
// AUTO-FILL REMEMBERED USERNAME
// ============================================================
(function rememberUsername() {
  const lastUser = localStorage.getItem('lifeasy_last_username');
  if (lastUser) document.getElementById('username').value = lastUser;
})();

document.getElementById('username').addEventListener('input', (e) => {
  localStorage.setItem('lifeasy_last_username', e.target.value.trim());
});

// ============================================================
// ENTER KEY (already handled by form submit, but ensure)
// ============================================================
document.getElementById('password').addEventListener('keydown', (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    handleLogin();
  }
});
</script>
</body>
</html>
