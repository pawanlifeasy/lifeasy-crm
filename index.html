<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Lifeasy INTERIOR</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', -apple-system, system-ui, sans-serif; }
body {
  min-height: 100vh;
  background: linear-gradient(135deg, #FEF2F2 0%, #F8FAFC 50%, #EFF6FF 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  color: #0F172A;
}

/* ============ LOADING OVERLAY ============ */
.loading-overlay {
  position: fixed; inset: 0;
  background: #FFFFFF;
  display: flex; align-items: center; justify-content: center;
  flex-direction: column; gap: 24px;
  z-index: 9999;
  transition: opacity 0.5s;
}
.loading-overlay.hide { opacity: 0; pointer-events: none; }

.loading-logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
}
.loading-logo .line1 {
  font-size: 52px;
  font-weight: 800;
  color: #E63946;
  letter-spacing: -1px;
  display: flex;
}
.loading-logo .line2 {
  font-size: 16px;
  font-weight: 600;
  color: #6B7280;
  letter-spacing: 8px;
  display: flex;
  margin-top: -8px;
  margin-left: 8px;
}
.loading-letter {
  display: inline-block;
  opacity: 0;
  transform: translateY(-20px);
  animation: letterIn 0.4s ease forwards;
}
@keyframes letterIn {
  to { opacity: 1; transform: translateY(0); }
}

.loading-dots {
  display: flex; gap: 8px;
  margin-top: 10px;
}
.loading-dots span {
  width: 10px; height: 10px;
  border-radius: 50%;
  background: #E63946;
  animation: bounce 1.4s infinite;
  opacity: 0;
}
.loading-dots span:nth-child(1) { animation-delay: 1.8s, 0s; }
.loading-dots span:nth-child(2) { animation-delay: 1.8s, 0.2s; }
.loading-dots span:nth-child(3) { animation-delay: 1.8s, 0.4s; }
@keyframes bounce {
  0% { opacity: 1; transform: scale(0.8); }
  40% { opacity: 1; transform: scale(1.2); }
  80%, 100% { opacity: 1; transform: scale(0.8); }
}
.loading-dots.show span { opacity: 1; }

.loading-text {
  color: #94A3B8;
  font-size: 13px;
  font-weight: 500;
  opacity: 0;
  transition: opacity 0.5s;
  margin-top: 4px;
}
.loading-text.show { opacity: 1; }

/* ============ LOGIN CARD ============ */
.login-card {
  background: #FFFFFF;
  border-radius: 24px;
  padding: 48px 40px;
  width: 100%;
  max-width: 440px;
  box-shadow: 0 20px 60px rgba(0, 0, 0, 0.08), 0 4px 16px rgba(230, 57, 70, 0.05);
  position: relative;
  overflow: hidden;
  opacity: 0;
  transform: translateY(20px);
  transition: all 0.6s cubic-bezier(0.16, 1, 0.3, 1);
}
.login-card.show { opacity: 1; transform: translateY(0); }

.login-card::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 5px;
  background: linear-gradient(90deg, #E63946 0%, #F87171 50%, #E63946 100%);
}

.logo-wrap {
  text-align: center;
  margin-bottom: 32px;
}
.logo-wrap img {
  max-width: 240px;
  height: auto;
}
.logo-fallback {
  display: none;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}
.logo-fallback .l1 {
  font-size: 40px;
  font-weight: 800;
  color: #E63946;
  letter-spacing: -1px;
  line-height: 1;
}
.logo-fallback .l2 {
  font-size: 12px;
  font-weight: 600;
  color: #6B7280;
  letter-spacing: 6px;
  margin-left: 6px;
}

.form-group {
  margin-bottom: 20px;
}
.form-group label {
  display: block;
  font-size: 13px;
  font-weight: 600;
  color: #334155;
  margin-bottom: 8px;
}
.form-group input {
  width: 100%;
  padding: 14px 16px;
  border: 2px solid #E2E8F0;
  border-radius: 12px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  transition: all 0.2s;
  background: #FFFFFF;
  color: #0F172A;
}
.form-group input:focus {
  border-color: #E63946;
  box-shadow: 0 0 0 4px rgba(230, 57, 70, 0.08);
}
.form-group input::placeholder {
  color: #94A3B8;
}

.login-btn {
  width: 100%;
  padding: 15px;
  border: none;
  border-radius: 12px;
  background: linear-gradient(135deg, #E63946 0%, #C8102E 100%);
  color: #FFFFFF;
  font-size: 15px;
  font-weight: 700;
  font-family: inherit;
  cursor: pointer;
  transition: all 0.2s;
  margin-top: 8px;
  box-shadow: 0 4px 12px rgba(230, 57, 70, 0.3);
}
.login-btn:hover:not(:disabled) {
  transform: translateY(-2px);
  box-shadow: 0 8px 20px rgba(230, 57, 70, 0.4);
}
.login-btn:active:not(:disabled) {
  transform: translateY(0);
}
.login-btn:disabled {
  opacity: 0.7;
  cursor: not-allowed;
}

.error-msg {
  background: #FEF2F2;
  color: #991B1B;
  padding: 12px 16px;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  margin-bottom: 16px;
  display: none;
  border-left: 4px solid #EF4444;
}
.error-msg.show { display: block; }

.footer {
  text-align: center;
  margin-top: 24px;
  padding-top: 20px;
  border-top: 1px solid #F1F5F9;
}
.footer p {
  font-size: 12px;
  color: #94A3B8;
  font-weight: 500;
}

/* Mobile */
@media (max-width: 480px) {
  .login-card { padding: 36px 24px; }
  .logo-wrap img { max-width: 200px; }
  .loading-logo .line1 { font-size: 42px; }
  .loading-logo .line2 { font-size: 13px; letter-spacing: 6px; }
}
</style>
</head>
<body>

<!-- ============ LOADING OVERLAY ============ -->
<div class="loading-overlay" id="loadingOverlay">
  <div class="loading-logo">
    <div class="line1" id="loadLine1"></div>
    <div class="line2" id="loadLine2"></div>
  </div>
  <div class="loading-dots" id="loadDots">
    <span></span><span></span><span></span>
  </div>
  <div class="loading-text" id="loadText">Loading Lifeasy INTERIOR...</div>
</div>

<!-- ============ LOGIN CARD ============ -->
<div class="login-card" id="loginCard">
  <div class="logo-wrap">
    <img src="https://lifeasyinterior.com/wp-content/uploads/2024/01/lifeasy-interior-logo.png" alt="Lifeasy INTERIOR" onerror="this.style.display='none'; this.nextElementSibling.style.display='flex';">
    <div class="logo-fallback">
      <div class="l1">Lifeasy</div>
      <div class="l2">INTERIOR</div>
    </div>
  </div>

  <div class="error-msg" id="errorMsg"></div>

  <div class="form-group">
    <label>Username</label>
    <input type="text" id="username" placeholder="Enter your username" autocomplete="username">
  </div>

  <div class="form-group">
    <label>Password</label>
    <input type="password" id="password" placeholder="Enter your password" autocomplete="current-password">
  </div>

  <button class="login-btn" id="loginBtn" onclick="doLogin()">Login</button>

  <div class="footer">
    <p>© Lifeasy INTERIOR</p>
  </div>
</div>

<script>
// ============================================================
// CONFIG
// ============================================================
const WORKER_URL = 'https://lifeasy-api.lifeasyinteriorcrm.workers.dev';

// ============================================================
// LOADING ANIMATION — Letter by letter
// ============================================================
const line1Text = 'Lifeasy';
const line2Text = 'INTERIOR';
const line1El = document.getElementById('loadLine1');
const line2El = document.getElementById('loadLine2');

line1Text.split('').forEach((ch, i) => {
  const span = document.createElement('span');
  span.className = 'loading-letter';
  span.textContent = ch;
  span.style.animationDelay = (i * 0.1) + 's';
  line1El.appendChild(span);
});

line2Text.split('').forEach((ch, i) => {
  const span = document.createElement('span');
  span.className = 'loading-letter';
  span.textContent = ch;
  span.style.animationDelay = (0.9 + i * 0.08) + 's';
  line2El.appendChild(span);
});

// After letters appear, show dots + text
setTimeout(() => {
  document.getElementById('loadDots').classList.add('show');
  document.getElementById('loadText').classList.add('show');
}, 1800);

// Hide loading, show login card
setTimeout(() => {
  document.getElementById('loadingOverlay').classList.add('hide');
  document.getElementById('loginCard').classList.add('show');
}, 2400);

// ============================================================
// LOGIN
// ============================================================
async function doLogin() {
  const username = document.getElementById('username').value.trim();
  const password = document.getElementById('password').value;
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('errorMsg');

  errEl.classList.remove('show');

  if (!username || !password) {
    errEl.textContent = 'Please enter username and password';
    errEl.classList.add('show');
    return;
  }

  btn.disabled = true;
  btn.textContent = 'Logging in...';

  try {
    const res = await fetch(WORKER_URL + '/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ action: 'login', username, password })
    });
    const data = await res.json();

    if (data.success) {
      // Save session
      const session = {
        userId: data.user.userId,
        name: data.user.name,
        role: data.user.role,
        username: data.user.username,
        phone: data.user.phone,
        email: data.user.email,
        loginTime: Date.now()
      };
      localStorage.setItem('lifeasy_session', JSON.stringify(session));

      btn.textContent = 'Success! Redirecting...';

      // Role-based redirect
      const role = data.user.role;
      const roleMap = {
        'Admin': 'admin',
        'Telecaller': 'telecaller',
        'Visit': 'visit',
        'Designer': 'designer',
        'Production': 'production',
        'Dispatch': 'dispatch',
        'Installation': 'installation'
      };
      const roleParam = roleMap[role] || 'admin';

      setTimeout(() => {
        window.location.href = 'dashboard.html?role=' + roleParam;
      }, 500);

    } else {
      errEl.textContent = data.error || 'Invalid credentials';
      errEl.classList.add('show');
      btn.disabled = false;
      btn.textContent = 'Login';
      document.getElementById('password').value = '';
    }
  } catch (err) {
    errEl.textContent = 'Connection error. Please try again.';
    errEl.classList.add('show');
    btn.disabled = false;
    btn.textContent = 'Login';
  }
}

// Enter key to login
document.getElementById('username').addEventListener('keypress', e => {
  if (e.key === 'Enter') document.getElementById('password').focus();
});
document.getElementById('password').addEventListener('keypress', e => {
  if (e.key === 'Enter') doLogin();
});

// ============================================================
// SESSION CHECK — agar already logged in
// ============================================================
(function checkSession() {
  const raw = localStorage.getItem('lifeasy_session');
  if (!raw) return;
  try {
    const session = JSON.parse(raw);
    if (Date.now() - session.loginTime < 8 * 60 * 60 * 1000) {
      const roleMap = { 'Admin': 'admin', 'Telecaller': 'telecaller', 'Visit': 'visit', 'Designer': 'designer', 'Production': 'production', 'Dispatch': 'dispatch', 'Installation': 'installation' };
      const roleParam = roleMap[session.role] || 'admin';
      setTimeout(() => {
        window.location.href = 'dashboard.html?role=' + roleParam;
      }, 2400);
    }
  } catch (e) { localStorage.clear(); }
})();
</script>
</body>
</html>
